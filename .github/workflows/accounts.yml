name: Konten verwalten

# Seit 18.11.2026 entstehen Konten per Einladungs-Link (tools/einladungen.ps1). Dieser Ablauf dient zum
# Passwort-Zurücksetzen und Löschen: Secret KONTEN = { "Anna": { "pw": "neues Passwort" }, "Alt": null } – das Passwort
# wird nur gesetzt, wenn es sich im Secret geändert hat. Danach ein Selbsttest mit einem Wegwerf-Konto. Dauer: ~1 Minute.
# Ins Log kommen nur Anzahlen. Vorher einmal „Datenbankschema“ laufen lassen, falls schema.sql geändert wurde.
on:
  workflow_dispatch:
    inputs:
      loeschen:
        description: 'Nur Testkonten löschen (Namen durch Komma; steht im öffentlichen Log!)'
        required: false
        default: ''

jobs:
  accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node scripts/accounts.mjs
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          KONTEN: ${{ secrets.KONTEN }}
          LOESCHEN: ${{ inputs.loeschen }}
