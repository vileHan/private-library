<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Geschenkkarte</title>
  <!-- Druckbare Geschenkkarte (10.11.2026): karte.html#g=<Geschenk-Code> – derselbe Code wie im App-Link (js/gift.js).
       Persönliche Daten stehen nur im Link, nicht in dieser Datei. QR-Code: qrcode-generator (jsDelivr, MIT). -->
  <style>
    :root { --paper: #fffaf0; --ink: #2b4a6f; --text: #2a2520; --muted: #7b7165; --line: #e6dbc8;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #ece6da; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); }
    .hint { max-width: 720px; margin: 16px auto; padding: 0 16px; color: var(--muted); font-size: .9rem; }
    .sheet { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; padding: 0 16px 24px; }
    .card { width: 105mm; min-height: 148mm; background: var(--paper); border: 1px solid var(--line); border-radius: 6px;
      padding: 12mm 10mm; display: flex; flex-direction: column; align-items: center; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,.12); }
    .front h1 { font-family: var(--serif); color: var(--ink); font-size: 26pt; line-height: 1.15; margin: 14mm 0 6mm; font-weight: 600; }
    .front .emoji { font-size: 34pt; }
    .front p { font-family: var(--serif); font-size: 12.5pt; white-space: pre-line; margin: 0 0 4mm; }
    .front .from { font-style: italic; color: var(--muted); }
    .back h2 { font-family: var(--serif); color: var(--ink); font-size: 16pt; margin: 0 0 4mm; }
    .back #qr { width: 46mm; height: 46mm; margin: 2mm 0 6mm; }
    .back #qr svg, .back #qr img { width: 100%; height: 100%; }
    .back ol { text-align: left; padding-left: 5mm; margin: 0; font-size: 10.5pt; }
    .back li { margin-bottom: 2.5mm; }
    .err { color: #b33; text-align: center; padding: 40px 16px; }
    @media print {
      body { background: #fff; }
      .hint { display: none; }
      .sheet { padding: 0; gap: 0; flex-direction: row-reverse; } /* A4 quer, außen bedruckt gefaltet: rechte Hälfte = Titelseite */
      .card { box-shadow: none; border: 1px dashed #ccc; border-radius: 0; break-inside: avoid; }
    }
  </style>
</head>
<body>
  <p class="hint">Vorderseite und Rückseite zum Ausdrucken (z. B. „Drucken“ → auf A4 quer, dann in der Mitte falten). Der QR-Code öffnet die App mit dem persönlichen Gruß.</p>
  <div class="sheet" id="sheet"></div>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script type="module">
    import { giftFromUrl } from './js/gift.js';
    const sheet = document.getElementById('sheet');
    const gift = giftFromUrl();
    const code = (location.hash.match(/[#&]g=([\w-]+)/) || [])[1];
    if (!gift || !code) {
      sheet.innerHTML = '<p class="err">Kein Geschenk-Code im Link (…/karte.html#g=…).</p>';
    } else {
      const appUrl = new URL(`./#g=${code}`, location.href).href;
      const esc = (s) => String(s || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      sheet.innerHTML = `
        <section class="card front">
          <div class="emoji">🎂📚</div>
          <h1>Alles Gute zum Geburtstag, ${esc(gift.n)}!</h1>
          ${gift.m ? `<p>${esc(gift.m)}</p>` : ''}
          ${gift.v ? `<p class="from">– ${esc(gift.v)}</p>` : ''}
        </section>
        <section class="card back">
          <h2>Deine eigene Bibliothek</h2>
          <div id="qr"></div>
          <ol>
            <li>QR-Code mit der Kamera scannen und den Link in Safari öffnen.</li>
            <li>Unten auf <b>Teilen</b> tippen → <b>„Zum Home-Bildschirm“</b>.</li>
            <li>Die App auf dem Home-Bildschirm öffnen – und loslegen: Bücher suchen, „Besitze“, „Gelesen“ oder „Merken“ antippen.</li>
          </ol>
        </section>`;
      const qr = window.qrcode(0, 'M');
      qr.addData(appUrl);
      qr.make();
      document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    }
  </script>
</body>
</html>
