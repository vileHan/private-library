<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oberflächen-Tests</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 16px; background: #fff; color: #222; display: flex; gap: 24px; flex-wrap: wrap; }
    li.ok::marker { content: "✓ "; color: #1a7f37; }
    li.fail::marker { content: "✗ "; color: #b3261e; }
    li.fail { color: #b3261e; }
    small { color: #666; }
    iframe { width: 360px; height: 740px; border: 1px solid #ccc; flex: none; }
    #out { flex: 1; min-width: 300px; }
  </style>
</head>
<body>
  <!-- Oberflächen-Tests: laden die App in einem 360 px breiten Rahmen (kleinstes übliches Handy) und klicken sie durch.
       Ändern KEINE eigenen Daten (keine Besitz-/Gelesen-Knöpfe). Ergebnis auch in window.__uiResults (für den Prüfer-Agenten).
       Aufruf: http://localhost:8080/tests/ui.html – Anforderungen siehe ANFORDERUNGEN.md (IDs in Klammern). -->
  <iframe id="app" src="../index.html"></iframe>
  <div id="out">
    <h1>Oberflächen-Tests</h1>
    <p id="status">Läuft …</p>
    <ul id="list"></ul>
  </div>
  <script type="module">
    const frame = document.getElementById('app');
    const results = [];
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const add = (name, ok, detail = '') => results.push({ name, ok: !!ok, detail });
    const doc = () => frame.contentDocument;
    const $ = (s) => doc().querySelector(s);
    const $$ = (s) => [...doc().querySelectorAll(s)];
    /** wartet, bis cond() wahr ist (max. ms), liefert die gebrauchte Zeit oder -1 */
    async function until(cond, ms = 8000) {
      const t0 = performance.now();
      while (performance.now() - t0 < ms) { try { if (cond()) return Math.round(performance.now() - t0); } catch {} await sleep(50); }
      return -1;
    }
    const noOverflow = () => doc().documentElement.scrollWidth <= frame.clientWidth + 1;
    async function search(q) {
      const inp = $('#searchInput');
      inp.value = q;
      inp.form.requestSubmit();
      await sleep(30);
      return until(() => !/läuft/i.test($('#searchStatus').textContent) && $$('#results .book').length > 0);
    }

    await new Promise((r) => frame.addEventListener('load', r, { once: true }));
    const errors = [];
    frame.contentWindow.addEventListener('error', (e) => errors.push(e.message));
    frame.contentWindow.addEventListener('unhandledrejection', (e) => errors.push(String(e.reason)));
    const gridBefore = frame.contentWindow.localStorage.getItem('bibliothek-einstellungen');

    try {
      // A5 / D1: Startseite
      await until(() => $$('#genreChips .chip').length > 0);
      add('Startseite: 15 Genre-Knöpfe (D1)', $$('#genreChips .chip').length === 15, `${$$('#genreChips .chip').length} Knöpfe`);
      add('Startseite: kein waagrechtes Scrollen auf 360 px (A5)', noOverflow(), `Breite ${doc().documentElement.scrollWidth}`);

      // B3 / B4 / C2: Reihensuche
      let ms = await search('eragon');
      const metas = $$('#results .book .meta').slice(0, 4).map((m) => m.textContent);
      add('„eragon“: Reihe oben in Bandfolge Band 1–4 (B3, C2)', metas.every((m, i) => m.startsWith(`Band ${i + 1}`)), metas.join(' | '));
      add('„eragon“: Antwort unter 1 s (B4)', ms >= 0 && ms < 1000, `${ms} ms`);
      add('Trefferliste: kein waagrechtes Scrollen (A5)', noOverflow());
      // C6: Die echten Knöpfe einer Trefferkarte reagieren (Mausklick) – Fehler 09.11.2026: Karten-Knöpfe nicht verdrahtet.
      // Nur an einem Buch ohne eigene Markierung, sofort wieder zurück (leerer Eintrag wird gelöscht).
      {
        const card = $$('#results .book').find((b) => !b.classList.contains('owned') && b.querySelector('.toggle.wish')?.getAttribute('aria-pressed') === 'false');
        const wish = card?.querySelector('.toggle.wish');
        wish?.querySelector('input').click();
        const on = await until(() => wish.getAttribute('aria-pressed') === 'true', 2000);
        wish?.querySelector('input').click();
        const off = await until(() => wish.getAttribute('aria-pressed') === 'false', 2000);
        add('Trefferkarte: Knopf „Merken“ reagiert auf Klick und lässt sich zurücknehmen (C6)', !!wish && on >= 0 && off >= 0, `an ${on} ms, aus ${off} ms`);
      }
      // C6: Während die Seite scrollt, sind die Schalter in den Knöpfen abgeschaltet (Weiterwischen ab einem Knopf)
      {
        const sw = $('#results .book .haptic-switch');
        frame.contentWindow.dispatchEvent(new frame.contentWindow.Event('scroll'));
        const during = frame.contentWindow.getComputedStyle(sw).pointerEvents;
        await sleep(500);
        const after = frame.contentWindow.getComputedStyle(sw).pointerEvents;
        add('Knöpfe: Schalter beim Scrollen abgeschaltet, danach wieder aktiv (C6)', during === 'none' && after !== 'none', `${during} → ${after}`);
      }
      // B7: Suchleiste ohne Lupe, „×“ sichtbar bei Text; Tastatur (Fokus) schließt bei Berührung außerhalb, nicht in der Leiste
      {
        const W = frame.contentWindow;
        const inp = $('#searchInput');
        const touchOn = (target) => {
          const t = new W.Touch({ identifier: 3, target, clientX: 20, clientY: 20 });
          target.dispatchEvent(new W.TouchEvent('touchstart', { touches: [t], changedTouches: [t], bubbles: true }));
          target.dispatchEvent(new W.TouchEvent('touchend', { touches: [], changedTouches: [t], bubbles: true }));
        };
        const noLupe = !$('#searchForm button[type="submit"]') && !$('.search-btn');
        const xShown = !$('#searchClear').hidden;
        // Text darf nicht unter das „×“ laufen: rechter Innenabstand des Feldes ≥ Breite des „×“
        const padOk = parseFloat(frame.contentWindow.getComputedStyle(inp).paddingRight) >= $('#searchClear').getBoundingClientRect().width;
        inp.focus();
        touchOn($('#searchClear'));
        const focusKeptInBar = doc().activeElement === inp;
        touchOn($('#results .book .title'));
        const blurredOutside = doc().activeElement !== inp;
        add('Suchleiste: keine Lupe, „×“ bei Text, Tastatur schließt nur bei Berührung außerhalb (B7)',
          noLupe && xShown && padOk && focusKeptInBar && blurredOutside, JSON.stringify({ noLupe, xShown, padOk, focusKeptInBar, blurredOutside }));
      }
      const heights = new Set($$('#results .book').slice(0, 8).map((b) => Math.round(b.getBoundingClientRect().height)));
      add('Alle Buch-Slots gleich hoch (C1)', heights.size === 1, [...heights].join(', ') + ' px');

      // C6: Knöpfe lösen nur bei einem echten Tipp aus – nicht beim Wischen, Scrollen oder wenn der Finger eine laufende
      // Scroll-Bewegung anhält; das „change“ des iOS-Schalters selbst zählt nie (iPhone legt ihn auch beim Wischen um).
      // Eigener Testknopf, eigene Daten bleiben unberührt.
      {
        const { switchToggle } = await import('../js/util.js');
        const lbl = switchToggle('wish', 'Test');
        document.body.append(lbl);
        const box = lbl.querySelector('input');
        let fired = 0;
        lbl.addEventListener('toggle', () => fired++);
        const ft = (type, x, y) => {
          const t = new Touch({ identifier: 7, target: box, clientX: x, clientY: y });
          box.dispatchEvent(new TouchEvent(type, { touches: /end|cancel/.test(type) ? [] : [t], changedTouches: [t], bubbles: true }));
        };
        const flip = () => { box.checked = !box.checked; box.dispatchEvent(new Event('change', { bubbles: true })); };
        const count = async (fn) => { const b = fired; await fn(); return fired - b; };
        const n = {};
        n.wischen = await count(() => { ft('touchstart', 10, 10); ft('touchmove', 14, 10); flip(); ft('touchmove', 70, 12); ft('touchend', 70, 12); });
        n.abbruch = await count(() => { ft('touchstart', 10, 10); flip(); ft('touchcancel', 10, 40); });
        // Liste scrollt noch, der Finger hält sie an
        n.anhalten = await count(() => { window.dispatchEvent(new Event('scroll')); ft('touchstart', 10, 10); ft('touchend', 10, 10); });
        await sleep(200);
        n.scrollen = await count(() => { ft('touchstart', 10, 10); window.dispatchEvent(new Event('scroll')); ft('touchend', 10, 10); });
        await sleep(200);
        // echter Tipp; der Klick, den der Browser danach schickt, zählt nicht doppelt
        n.tipp = await count(() => { ft('touchstart', 10, 10); flip(); ft('touchend', 11, 10); box.click(); });
        await sleep(900);
        n.maus = await count(() => box.click()); // Maus/Tastatur
        lbl.remove();
        add('Knöpfe: nur echter Tipp löst aus – nicht Wischen, Abbruch, Anhalten, Scrollen (C6)',
          n.wischen === 0 && n.abbruch === 0 && n.anhalten === 0 && n.scrollen === 0 && n.tipp === 1 && n.maus === 1, JSON.stringify(n));
      }

      // C5 / C6: Detailblatt
      $('#results .more-btn').click();
      await until(() => !$('#sheet').hidden);
      const sheetTxt = $('#sheet').textContent;
      add('Detailblatt: Besitze/Gelesen/Merken, Meine Angaben, Autor-Link (C5)',
        ['Besitze', 'Gelesen', 'Merken', 'Bewertung', 'Notiz'].every((w) => sheetTxt.includes(w)) && !!$('#sheet .author .link-btn'), '');
      const amazon = $('#sheet .amazon-link')?.href || '';
      add('Detailblatt: Link „Bei Amazon ansehen“ (ISBN-10, neuer Tab)',
        /^https:\/\/www\.amazon\.de\/dp\/\d{9}[\dX]$/.test(amazon) && $('#sheet .amazon-link').target === '_blank', amazon || 'fehlt');
      const blurbMs = await until(() => $('#sheet .blurb-text') && !$('#sheet .blurb.loading') || !$('#sheet .blurb'), 8000);
      add('Detailblatt: Klappentext geladen oder Abschnitt entfernt (C5)', blurbMs >= 0, `${blurbMs} ms`);
      add('Detailblatt: kein waagrechtes Scrollen (A5)', $('#sheet .sheet-panel').scrollWidth <= frame.clientWidth + 1);
      // Herunterziehen per Finger-Ereignissen (C6)
      const grip = $('#sheet .sheet-grip');
      const top = $('#sheet .sheet-panel').getBoundingClientRect().top;
      const touch = (type, y) => {
        const t = new frame.contentWindow.Touch({ identifier: 1, target: grip, clientX: 180, clientY: y });
        grip.dispatchEvent(new frame.contentWindow.TouchEvent(type, { touches: type === 'touchend' ? [] : [t], changedTouches: [t], bubbles: true, cancelable: true }));
      };
      touch('touchstart', top + 5);
      for (let i = 1; i <= 10; i++) { touch('touchmove', top + 5 + i * 45); await sleep(30); }
      touch('touchend', top + 455);
      add('Detailblatt lässt sich nach unten wegziehen (C6)', (await until(() => $('#sheet').hidden, 1500)) >= 0);

      // D2: Autorenseite und Zurück
      $('#results .more-btn').click();
      await until(() => !$('#sheet').hidden);
      const author = $('#sheet .author .link-btn').textContent.replace(' ›', '');
      $('#sheet .author .link-btn').click();
      ms = await until(() => $('#browseTitle').textContent === author && $$('#results .book').length > 0);
      add('Autorenseite öffnet sich (D2)', ms >= 0, `${author}, ${ms} ms`);
      $('#browseBack').click();
      await sleep(200);
      add('„‹“ stellt die vorherige Suche wieder her (D2)', $('#searchInput').value === 'eragon' && $$('#results .book').length > 0);

      // D7: Reihe im Detailblatt antippen → alle Bände in Bandfolge, „‹“ zurück zur Suche
      $('#results .more-btn').click();
      await until(() => !$('#sheet').hidden);
      const seriesLink = $$('#sheet .sheet-facts .link-btn').find((b) => /Band \d+ ›$/.test(b.textContent));
      seriesLink?.click();
      ms = await until(() => $('#browseKind').textContent === 'Reihe' && $$('#results .book').length >= 3);
      const bands = $$('#results .book .meta').map((m) => (m.textContent.match(/^Band (\d+)/) || [])[1]).filter(Boolean).map(Number);
      add('Reihe im Detailblatt: ganze Reihe in Bandfolge (D7)', !!seriesLink && ms >= 0 && bands.length >= 3 && bands.every((b, i) => i === 0 || b >= bands[i - 1]),
        `${seriesLink?.textContent || 'kein Link'}; Bände ${bands.join(', ')}; ${ms} ms`);
      $('#browseBack').click();
      await sleep(200);
      add('Reihe: „‹“ stellt die vorherige Suche wieder her (D7)', $('#searchInput').value === 'eragon' && $('#browseBar').hidden);

      // D1: Genre
      $('#searchClear').click(); // „×“ leert die Suche → Startansicht mit Genres (B7)
      add('„×“ leert die Suchleiste und blendet sich aus (B7)', $('#searchInput').value === '' && $('#searchClear').hidden);
      await until(() => !$('#genreChips').hidden);
      $$('#genreChips .chip').find((c) => c.textContent === 'Fantasy').click();
      ms = await until(() => $$('#results .book').length >= 50);
      add('Genre „Fantasy“: 50 Bücher unter 1 s (D1)', ms >= 0 && ms < 1000, `${ms} ms`);
      add('„Mehr laden“ vorhanden (B6)', !$('#moreBtn').hidden);
      $('#browseBack').click();
      await sleep(200);

      // D4: Eigener Eintrag mit veralteten Daten (wie nach einem Scan: „Rewitched 2026“) wird aufgefrischt,
      // eigene Angaben bleiben. Testeintrag mit eigenem Schlüssel, wird danach wieder gelöscht.
      // Module im Rahmen der App laden (gleiche Instanz wie die App), absolute Adresse wegen eval
      const imp = (p) => frame.contentWindow.eval(`import('${new URL(`js/${p}`, frame.contentWindow.location.href)}')`);
      const { store } = await imp('store.js');
      const lib = await imp('library.js');
      const KEY = 'ui-test-refresh';
      await store.put({ key: KEY, title: 'Rewitched', sortTitle: 'Rewitched', subtitle: '', authors: ['Lucy Jane Wood'], authorSort: 'Wood, Lucy Jane',
        year: 2026, genre: 'Fantasy', publisher: 'Lübbe', series: '', volume: '', isbns: ['9783404015061'], coverIsbns: [], coverIds: [], editions: [],
        owned: true, read: true, readAt: '2026-01-02', wish: false, rating: 4, notes: 'Testnotiz', tags: ['Test'], ownedIsbns: ['9783404015061'],
        addedAt: '2026-01-01T00:00:00.000Z' });
      await lib.loadLibrary();
      try {
        await search('rewitched');
        await sleep(500);
        const e = (await store.getAll()).find((x) => x.key === KEY);
        add('Eigener Eintrag wird aufgefrischt, eigene Angaben bleiben (D4)',
          e && e.year === 2025 && e.isbns.length >= 2 && e.owned && e.read && e.rating === 4 && e.notes === 'Testnotiz' && e.tags[0] === 'Test' && e.readAt === '2026-01-02',
          e ? `Jahr ${e.year}, ${e.isbns.length} ISBN, Besitz ${e.owned}, Bewertung ${e.rating}` : 'Eintrag fehlt');
      } finally {
        await store.remove(KEY);
        await lib.loadLibrary();
      }

      // B5: ISBN zeigt das ganze Werk
      ms = await search('9783404015061');
      const r = $('#results .book');
      add('ISBN 9783404015061 → „Rewitched“, 2025 (B5)', r && r.querySelector('.title').textContent === 'Rewitched' && /2025/.test(r.querySelector('.meta').textContent),
        r ? `${r.querySelector('.title').textContent} / ${r.querySelector('.meta').textContent}` : 'kein Treffer');
      ms = await search('9783570552698');
      add('ISBN außerhalb des Katalogs (Sachbuch) wird gefunden (B5)', /Menschheit/.test($('#results .book .title')?.textContent || ''));

      // C4: Cover-Raster
      await search('harry potter');
      // C8: Cover antippen → Vollbild (Detailblatt und Liste); jede nächste Aktion schließt nur das Vollbild
      $('#results .more-btn').click();
      await until(() => !$('#sheet').hidden && $('#sheet .sheet-head .cover img.loaded'), 8000);
      $('#sheet .sheet-head .cover').click();
      const zoomImg = $('.cover-zoom img');
      const zoomBox = zoomImg?.getBoundingClientRect();
      add('Detailblatt: Cover antippen öffnet Vollbild (C8)', !!zoomImg && zoomBox.width > frame.clientWidth * 0.8, zoomImg ? `${Math.round(zoomBox.width)}×${Math.round(zoomBox.height)} px` : 'kein Vollbild');
      doc().dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      await sleep(250);
      add('Vollbild: eine Taste schließt nur das Vollbild (C8)', !$('.cover-zoom') && !$('#sheet').hidden);
      $('#sheet .sheet-close').click();
      await sleep(250);
      // Ausgangsansicht des Geräts: Liste
      for (let i = 0; i < 2 && doc().body.classList.contains('grid-view'); i++) { $('#viewToggle').click(); await sleep(50); }
      await until(() => $('#results .book .cover img.loaded'), 8000);
      let listCover = $$('#results .book .cover').find((c) => c.querySelector('img.loaded'));
      if (!listCover) { // Cover-Dienste gerade langsam: Bild nachstellen – geprüft wird nur das Antippen
        listCover = $('#results .book .cover');
        const im = listCover.querySelector('img');
        im.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==';
        im.classList.add('loaded');
      }
      // Fingertipp aufs Cover, danach der „Geisterklick“ des Browsers auf das schon offene Vollbild: muss offen bleiben
      const W = frame.contentWindow;
      const tch = (type) => {
        const t = new W.Touch({ identifier: 9, target: listCover, clientX: 40, clientY: 40 });
        listCover.dispatchEvent(new W.TouchEvent(type, { touches: type === 'touchend' ? [] : [t], changedTouches: [t], bubbles: true }));
      };
      await sleep(200);
      tch('touchstart'); tch('touchend');
      $('.cover-zoom')?.dispatchEvent(new W.MouseEvent('click', { bubbles: true }));
      await sleep(200);
      const ghostOk = !!$('.cover-zoom') && !$('.cover-zoom.closing');
      add('Vollbild per Fingertipp bleibt trotz Geisterklick offen (C8)', ghostOk);
      $('.cover-zoom')?.dispatchEvent(new W.PointerEvent('pointerdown', { bubbles: true }));
      $('.cover-zoom')?.dispatchEvent(new W.PointerEvent('pointerup', { bubbles: true }));
      await sleep(500);
      await sleep(900); // danach mit der Maus
      listCover?.click();
      const opened = !!$('.cover-zoom');
      $('.cover-zoom')?.dispatchEvent(new frame.contentWindow.PointerEvent('pointerdown', { bubbles: true }));
      const hidden = !!$('.cover-zoom.closing');
      $('.cover-zoom')?.dispatchEvent(new frame.contentWindow.PointerEvent('pointerup', { bubbles: true }));
      await sleep(500);
      add('Liste: Cover antippen öffnet Vollbild, nächste Berührung schließt es (C8)', opened && hidden && !$('.cover-zoom'),
        `geöffnet ${opened}, beim Berühren ausgeblendet ${hidden}`);
      // C4: Liste → Raster → Liste; im Raster öffnet ein Klick aufs Cover kein Vollbild
      $('#viewToggle').click();
      await sleep(200);
      const books = $$('#results .book').slice(0, 2).map((b) => b.getBoundingClientRect());
      add('Cover-Raster: 2 Cover nebeneinander (C4)', doc().body.classList.contains('grid-view') && books.length === 2 && Math.abs(books[0].top - books[1].top) < 2);
      add('Cover-Raster: kein waagrechtes Scrollen (A5)', noOverflow());
      listCover?.click();
      const zoomInGrid = !!$('.cover-zoom');
      $('#viewToggle').click();
      await sleep(100);
      add('Zweiter Klick: zurück zur Liste; im Raster kein Vollbild (C4)', !doc().body.classList.contains('grid-view') && !zoomInGrid);
    } catch (err) {
      add('Testlauf abgebrochen', false, err.message);
    } finally {
      if (gridBefore === null) frame.contentWindow.localStorage.removeItem('bibliothek-einstellungen');
      else frame.contentWindow.localStorage.setItem('bibliothek-einstellungen', gridBefore);
    }
    add('Keine JavaScript-Fehler in der App', errors.length === 0, errors.slice(0, 3).join(' | '));

    const failed = results.filter((x) => !x.ok).length;
    document.getElementById('status').textContent = failed ? `${failed} von ${results.length} Tests fehlgeschlagen` : `Alle ${results.length} Tests bestanden`;
    for (const x of results) {
      const li = document.createElement('li');
      li.className = x.ok ? 'ok' : 'fail';
      li.innerHTML = `${x.name} <small>${x.detail || ''}</small>`;
      document.getElementById('list').append(li);
    }
    window.__uiResults = results;
  </script>
</body>
</html>
